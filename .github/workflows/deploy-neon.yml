name: Deploy Neon Function

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-neon-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  NEON_PROJECT_ID: long-water-29875313
  NEON_BRANCH: production

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy Neon Function
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write function env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > .env.local <<EOF
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          EOF

      - name: Deploy Neon function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: npx --yes neon@9.4.0 deploy --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --env .env.local --yes --no-env-pull
