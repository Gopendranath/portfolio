name: Deploy Neon Function

on:
  push:
    branches: [main]
    # Function source plus its exact build/deploy dependencies.
    # Keep in sync with tsconfig.functions.json and neon.ts.
    paths:
      - functions/**
      - '!functions/__tests__/**'
      - neon.ts
      - src/data/about.ts
      - src/data/profile.ts
      - src/data/projects.ts
      - src/data/site.ts
      - src/data/types.ts
      - src/lib/chat/protocol.ts
      - package.json
      - pnpm-lock.yaml
      - tsconfig.functions.json
  workflow_dispatch:

concurrency:
  group: deploy-neon-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  NEON_PROJECT_ID: long-water-29875313
  NEON_BRANCH: production

jobs:
  deploy:
    name: Deploy Neon Function
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Write function env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > .env.local <<EOF
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          EOF

      - name: Deploy Neon function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: npx --yes neon@9.4.0 deploy --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --env .env.local --yes --no-env-pull
