<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <link rel="describedby" type="text/plain" href="/llms.txt" />

      rel="ai-catalog"
      type="application/json"
      href="/.well-known/ai-catalog.json"
    />
    <script>
      (() => {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.dataset.theme = 'light'
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', '#f5f3ec')
          }
        } catch {
          // Keep the default dark theme when storage is unavailable.
        }
      })()
    </script>
    <title>Gopendranath Sasmal — Full Stack Developer</title>
    <meta
      name="description"
      content="Full-stack developer in Bengaluru building web products across React, TypeScript, Java, Spring Boot, Node.js, and AI. Open to full-stack roles."
    />
    <meta
      property="og:title"
      content="Gopendranath Sasmal — Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Full-stack developer in Bengaluru building web products across React, TypeScript, Java, Spring Boot, Node.js, and AI. Open to full-stack roles."
